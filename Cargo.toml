[package]
name = "tokio-events"
version = "0.3.2"
edition = "2021"
authors = ["Abhishek Khushal Harde <akharde1998@gmail.com>"]
description = "A modern, type-safe async event bus for Rust applications"
repository = "https://github.com/abhiyana/tokio-events"
license = "MIT OR Apache-2.0"
keywords = ["async", "events", "event-bus", "tokio", "pubsub"]
categories = ["asynchronous", "concurrency"]
documentation = "https://docs.rs/tokio-events"
exclude = [
    "demo-api-gateway/**/*",
    "demo-backend-worker/**/*",
    "demo-shared/**/*"
]
[workspace]
members = [
    "tokio-events-macros",
    "demo-shared",
    "demo-api-gateway",
    "demo-backend-worker"
]

[dependencies]
tokio = { version = "1.46.1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
thiserror = "2.0.12"
serde_json = "1.0"
dashmap = "6.1.0"
tracing = { version = "0.1", features = ["std"] }
num_cpus = "1.16.0"
fxhash = "0.2.1"
redb = { version = "4.1.0", optional = true }
metrics = { version = "0.22", optional = true }
async-nats = { version = "0.33", optional = true }
prost = { version = "0.13", optional = true }
tokio-events-macros = { path = "tokio-events-macros", version = "0.3.0", optional = true }

[features]
default = ["macros"]
persistence = ["dep:redb"]
macros = ["dep:tokio-events-macros"]
metrics = ["dep:metrics"]
remote = ["dep:async-nats"]
protobuf = ["dep:prost"]

[dev-dependencies]
tempfile = "3.27.0"
tokio-stream = "0.1.18"
criterion = { version = "0.5", features = ["async_tokio"] }

[[example]]
name = "03_persistent_queue"
required-features = ["persistence"]

[[example]]
name = "04_distributed_nats"
required-features = ["remote"]

[[bench]]
name = "throughput"
harness = false
